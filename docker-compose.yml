version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"       
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 80
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel
      DB_PASSWORD: Pass123
      DB_OPTIONS_ENCRYPT: 'no'
      DB_OPTIONS_TRUST_SERVER_CERTIFICATE: 'yes'

  mysql:  # Replace mssql
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: rootpass
        MYSQL_DATABASE: laravel_db
        MYSQL_USER: laravel
        MYSQL_PASSWORD: Pass123
      ports:
        - "3306:3306"
      healthcheck:                     # ← MySQL health check
        test: ["CMD", "mysql", "-ularavel", "-pPass123", "-e", "SELECT 1"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 30s    # ← Give MySQL time to initialize
      volumes:
        - mysql_data:/var/lib/mysql

volumes:
  mysql_data: